[project]
name = "orbitra-reroute"
version = "0.1.0"
description = "AI agent for cold-chain shipment pre-re-routing — AMD Hackathon Act III"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "openai>=1.54",          # OpenAI-compatible SDK for Token Factory + Evolus
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "openpyxl>=3.1",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "google-api-python-client>=2.150",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "pyyaml>=6.0",
    "rich>=13.9",             # smoke script output
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",            # install ROCm build separately: pip install torch --index-url https://download.pytorch.org/whl/rocm6.1
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",           # TestClient
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
